; ============================================================================
;  esp32-sys-health example: full_demo
; ============================================================================
;  A standalone PlatformIO project that exercises every public API in
;  sys_health.h from an interactive serial console. See README.md in this
;  folder for the command list and expected output.
;
;  lib_deps points straight at the library repo's src/ folder (two levels up
;  from this file: examples/full_demo/ -> examples/ -> repo root -> src/).
;  Pointing at the repo ROOT instead would make PlatformIO try to copy this
;  very examples/full_demo/ directory (and its own .pio build output) into
;  itself, which fails; src/ has no such self-reference. "file://" copies
;  the folder into .pio/libdeps instead of symlinking, so it builds without
;  Windows developer-mode/symlink permissions. When using this pattern in
;  your OWN project, use the tagged GitHub URL instead (see the top-level
;  README's Install section) so your build stays pinned and reproducible.
;
;  Board: any ESP32 works (classic, S3, C3...). esp32dev (plain classic ESP32)
;  is the default because it needs no custom board JSON. [env:esp32s3] below
;  targets a generic ESP32-S3 devkit for boards like the YD-ESP32-S3 or XIAO
;  ESP32-S3 that ESP32-InternetMonitor and Greenhouse_System actually run on.
;
;  Build:           pio run -e esp32dev   (or -e esp32s3)
;  Flash + monitor: pio run -e esp32s3 -t upload -t monitor
;                    (set upload_port/monitor_port below, or pass
;                     --upload-port / --monitor-port on the command line)
; ============================================================================

[env:esp32dev]
platform  = espressif32
board     = esp32dev
framework = arduino

monitor_speed = 115200

lib_deps =
    file://../../src

; ----------------------------------------------------------------------------
; [env:esp32s3] - generic ESP32-S3 devkit
; ----------------------------------------------------------------------------
; ARDUINO_USB_CDC_ON_BOOT=0 matches the YD-ESP32-S3 boards used by
; ESP32-InternetMonitor: with it left at 1 (native-USB CDC), that hardware
; produces no serial output at all. A board with genuine native-USB-only
; serial (e.g. the XIAO ESP32-S3) needs the opposite (=1) -- see that
; project's platformio.ini [env:xiao_bench] for the reasoning either way.
[env:esp32s3]
platform  = espressif32
board     = esp32-s3-devkitc-1
framework = arduino

monitor_speed = 115200
build_flags =
    -D ARDUINO_USB_CDC_ON_BOOT=0

; Uncomment and set to your board's port, or pass --upload-port/--monitor-port:
; upload_port  = COM11
; monitor_port = COM11

lib_deps =
    file://../../src
